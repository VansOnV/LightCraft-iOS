name: LightCraft
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  LightCraft:
    type: application
    platform: iOS
    sources:
      - App
      - Generated/lightcraft_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lightcraft
        SWIFT_VERSION: "5.0"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: "-llightcraft_ffi"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick photos to edit."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
