name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Generate FFI Bindings and Build Rust Library
        run: |
          mkdir -p ios/Generated
          # Build the Rust FFI library for iOS device architecture
          cargo build --manifest-path ffi/Cargo.toml --target aarch64-apple-ios --release
          
          # Generate Swift bindings using uniffi-bindgen binary/script if configured
          if [ -f ffi/uniffi-bindgen.rs ]; then
            cargo run --manifest-path ffi/Cargo.toml --bin uniffi-bindgen generate --library target/aarch64-apple-ios/release/liblightcraft_ffi.dylib --language swift --out-dir ios/Generated
          fi
          
          # Fallback check or touch to ensure file exists if bindgen script handles it differently
          if [ ! -f ios/Generated/lightcraft_ffi.swift ]; then
            touch ios/Generated/lightcraft_ffi.swift
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project and Build IPA
        run: |
          cd ios
          xcodegen generate
          
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/App.xcarchive
            
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r App.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/App.ipa
