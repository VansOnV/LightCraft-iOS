name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust library for iPhone
        run: cargo build -p lightcraft-ffi --release --target aarch64-apple-ios

      - name: Build host library (for binding generation)
        run: cargo build -p lightcraft-ffi --release

      - name: Generate Swift bindings
        run: |
          mkdir -p ios/Generated
          cargo run -p lightcraft-ffi --bin uniffi-bindgen -- generate \
            --library target/release/liblightcraft_ffi.dylib \
            --language swift --out-dir ios/Generated
          mv ios/Generated/lightcraft_ffiFFI.modulemap ios/Generated/module.modulemap

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project ios/LightCraft.xcodeproj -scheme LightCraft \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LightCraft.app Payload/
          zip -qr LightCraft.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LightCraft-unsigned-ipa
          path: LightCraft.ipa
